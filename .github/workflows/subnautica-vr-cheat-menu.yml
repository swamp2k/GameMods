name: Subnautica VR Cheat Menu

on:
  push:
    paths:
      - "Subnautica/VR-Cheat-Menu/**"
      - ".github/workflows/subnautica-vr-cheat-menu.yml"
  pull_request:
    paths:
      - "Subnautica/VR-Cheat-Menu/**"
      - ".github/workflows/subnautica-vr-cheat-menu.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Subnautica/VR-Cheat-Menu/SubnauticaVRCheats.csproj

      - name: Build
        run: dotnet build Subnautica/VR-Cheat-Menu/SubnauticaVRCheats.csproj -c Release --no-restore

      - name: Publish portable test build
        run: dotnet publish Subnautica/VR-Cheat-Menu/SubnauticaVRCheats.csproj -c Release -r win-x64 --self-contained true -o artifacts/SubnauticaVRCheats

      - name: Verify test package
        shell: pwsh
        run: |
          $required = @(
            "artifacts/SubnauticaVRCheats/SubnauticaVRCheats.exe",
            "artifacts/SubnauticaVRCheats/openvr_api.dll",
            "artifacts/SubnauticaVRCheats/bindings/actions.json",
            "artifacts/SubnauticaVRCheats/bindings/bindings_oculus_touch.json"
          )

          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Published package is missing required file: $path"
            }
          }

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: SubnauticaVRCheats-win-x64
          path: artifacts/SubnauticaVRCheats/
          if-no-files-found: error
          retention-days: 14
